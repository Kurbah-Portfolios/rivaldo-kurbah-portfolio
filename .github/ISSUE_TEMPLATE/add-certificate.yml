name: Add portfolio certificate
description: Owner-only publishing form for adding a certificate to the Certifications page.
title: "[Portfolio Certificate] "
body:
  - type: markdown
    attributes:
      value: |
        Use this form only while signed in as **KurbahTech**. The publishing workflow ignores submissions from other accounts.

        For **Certificate image**, drag and drop the image into the field or paste a direct HTTPS image URL.
  - type: input
    id: heading
    attributes:
      label: Heading
      description: Provider or short heading, for example Upgrad, Cisco, Coursera, GUVI.
      placeholder: Upgrad
    validations:
      required: true
  - type: input
    id: program
    attributes:
      label: Certificate / program name
      placeholder: Generative AI Foundations Certificate Program
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Description
      description: Short public description shown on the portfolio card.
      placeholder: Professional certificate covering...
    validations:
      required: false
  - type: textarea
    id: image
    attributes:
      label: Certificate image
      description: Drag and drop the certificate image here, or paste a direct HTTPS image URL.
      placeholder: Drag and drop an image here
    validations:
      required: true
  - type: input
    id: verify_url
    attributes:
      label: Certificate / verification URL
      description: Optional official certificate or verification page.
      placeholder: https://...
    validations:
      required: false
  - type: input
    id: learn_url
    attributes:
      label: Want to Know More URL
      description: Optional provider, course or referral URL.
      placeholder: https://...
    validations:
      required: false
  - type: dropdown
    id: category
    attributes:
      label: Category
      options:
        - Artificial Intelligence
        - Cybersecurity
        - Networking
        - Programming
        - Internship / Experience
        - Other
    validations:
      required: true
